<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Happy Birthday</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-family);
            touch-action: manipulation; /* 防止双击缩放 */
            overscroll-behavior: none;  /* 防止下拉刷新/回弹 */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        .ambient-light {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 120vmin;
            height: 120vmin;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, rgba(15, 23, 42, 0) 70%);
            transform: translate(-50%, -50%);
            animation: breathe 8s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes breathe {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.8; }
        }

        main {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 0 16px;
            opacity: 0;
            animation: fadeIn 3s ease-out forwards 1s;
            pointer-events: none;
        }

        h1 {
            font-size: clamp(2rem, 9vw, 5rem);
            font-weight: 300;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            color: #fff;
        }

        p.subtitle {
            font-size: clamp(0.8rem, 2.5vw, 1.2rem);
            opacity: 0.6;
            font-weight: 200;
            letter-spacing: 0.2em;
        }

        .interaction-hint {
            position: fixed;
            bottom: calc(10% + env(safe-area-inset-bottom)); /* 适配全面屏手势条 */
            left: 0;
            width: 100%;
            text-align: center;
            font-size: clamp(1rem, 4vw, 20px);
            font-weight: bold;
            z-index: 2;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 20px rgba(0,191,255,0.7);
            pointer-events: none;
            transition: opacity 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <main>
        <h1>Happy Birthday</h1>
        <p class="subtitle">=w=</p>
    </main>

    <div id="hint" class="interaction-hint" style="opacity: 0.5; animation: pulseHint 2s ease-in-out infinite;">点击屏幕试试</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hint = document.getElementById('hint');
            let isPlaying = false;
            let audioContext = null;
            let nextNoteTime = 0;
            let noteIndex = 0;
            let timerID = null;

            const NOTE_FREQUENCIES = {
                'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13,
                'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00,
                'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
                'C5': 523.25, 'C#5': 554.37, 'D5': 587.33, 'D#5': 622.25,
                'E5': 659.25, 'F5': 698.46, 'F#5': 739.99, 'G5': 783.99,
                'G#5': 830.61, 'A5': 880.00, 'A#5': 932.33, 'B5': 987.77,
                'C6': 1046.50
            };

            const LOW_NOTES = {
                'G3': 196.00, 'A3': 220.00, 'B3': 246.94
            };

            const allNotes = { ...LOW_NOTES, ...NOTE_FREQUENCIES };

            const melody = [
                { note: 'G3', duration: 0.5 }, { note: 'G3', duration: 0.5 }, { note: 'A3', duration: 1 }, { note: 'G3', duration: 1 }, { note: 'C4', duration: 1 }, { note: 'B3', duration: 2 },
                { note: 'G3', duration: 0.5 }, { note: 'G3', duration: 0.5 }, { note: 'A3', duration: 1 }, { note: 'G3', duration: 1 }, { note: 'D4', duration: 1 }, { note: 'C4', duration: 2 },
                { note: 'G3', duration: 0.5 }, { note: 'G3', duration: 0.5 }, { note: 'G4', duration: 1 }, { note: 'E4', duration: 1 }, { note: 'C4', duration: 1 }, { note: 'B3', duration: 1 }, { note: 'A3', duration: 1 },
                { note: 'F4', duration: 0.5 }, { note: 'F4', duration: 0.5 }, { note: 'E4', duration: 1 }, { note: 'C4', duration: 1 }, { note: 'D4', duration: 1 }, { note: 'C4', duration: 2 }
            ];

            // ① 创建/恢复 AudioContext —— 必须在用户手势中，且等待异步 resume
            async function initAudio() {
                if (!audioContext) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    audioContext = new AC();
                }
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                // 兜底：部分安卓机首次 resume 后仍可能 suspended
                if (audioContext.state !== 'running') {
                    await audioContext.resume();
                }
            }

            function playTone(freq, startTime) {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = freq;
                oscillator.type = 'sine';

                // ② 用线性淡入避免移动端爆音，包络缩短适配短音符
                const dur = 0.9;
                gainNode.gain.setValueAtTime(0.0001, startTime);
                gainNode.gain.linearRampToValueAtTime(0.3, startTime + 0.02);
                gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + dur);

                oscillator.start(startTime);
                oscillator.stop(startTime + dur + 0.05);
            }

            function scheduler() {
                while (nextNoteTime < audioContext.currentTime + 0.15) {
                    if (noteIndex >= melody.length) break;

                    const noteData = melody[noteIndex];
                    const freq = allNotes[noteData.note];
                    if (freq) {
                        playTone(freq * 2, nextNoteTime);
                    }
                    nextNoteTime += noteData.duration * 0.6;
                    noteIndex++;
                }

                // ③ 播放结束
                if (noteIndex >= melody.length && nextNoteTime < audioContext.currentTime) {
                    stopMusic();
                    hint.innerText = "再次点击重播";
                    hint.style.animation = 'none';
                    hint.style.opacity = '0.5';
                    return;
                }
                timerID = setTimeout(scheduler, 40); // 用 setTimeout 而非 rAF，后台也稳定
            }

            function stopMusic() {
                if (timerID) { clearTimeout(timerID); timerID = null; }
                isPlaying = false;
            }

            async function startMusic() {
                if (isPlaying) return;
                try {
                    await initAudio();
                } catch (e) {
                    return; // 激活失败，等待下次点击
                }
                if (audioContext.state !== 'running') return;

                isPlaying = true;
                noteIndex = 0;
                nextNoteTime = audioContext.currentTime + 0.15;

                hint.style.animation = 'none';
                hint.style.opacity = '0';

                scheduler();
            }

            // ④ 使用 pointerdown，安卓上响应即时；同时移除穿透触发的 click 重复调用
            document.body.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                startMusic();
            }, { passive: false });

            // 防止安卓双击缩放
            let lastTouchEnd = 0;
            document.addEventListener('touchend', (e) => {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) e.preventDefault();
                lastTouchEnd = now;
            }, { passive: false });

            // ⑤ 切后台回来时恢复音频上下文
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && audioContext && audioContext.state === 'suspended' && isPlaying) {
                    audioContext.resume();
                }
            });
        });
    </script>
</body>
</html>
